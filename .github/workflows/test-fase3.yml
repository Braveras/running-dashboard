name: Test fase 3 (probe)
# Temporal: prueba fetch_data.py en rama sin commit ni deploy.
# IMPORTANTE: rota el secret igualmente — el refresh de Garmin consume el token
# y no re-guardarlo rompería la cadena del cron diario.

on:
  workflow_dispatch:
  push:
    branches: [fase-3]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Madrid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "garminconnect==0.3.5" tzdata
      - name: Fetch Garmin data (probe)
        env:
          GARMIN_TOKENS_B64: ${{ secrets.GARMIN_TOKENS_B64 }}
          GARMIN_DISPLAY_NAME: ${{ secrets.GARMIN_DISPLAY_NAME }}
          TOKEN_OUT: .garmin_tokens_new
        run: |
          echo "$GARMIN_TOKENS_B64" | base64 -d > .garmin_tokens
          python scripts/fetch_data.py
          rm .garmin_tokens
      - name: Rotate token secret
        if: always()
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_PAT }}
        run: |
          if [ -f .garmin_tokens_new ]; then
            base64 -w0 .garmin_tokens_new | gh secret set GARMIN_TOKENS_B64 --repo "$GITHUB_REPOSITORY"
            echo "Secret GARMIN_TOKENS_B64 rotado."
            rm .garmin_tokens_new
          else
            echo "Sin token nuevo que rotar."
          fi
      - name: Resumen de campos nuevos
        run: |
          python - <<'EOF'
          import json
          det = json.load(open('data/runs_detail.json'))
          con_pct = [v['pct_z2'] for v in det.values() if v.get('pct_z2') is not None]
          print(f"pct_z2: {len(con_pct)}/{len(det)} carreras · ejemplo: {con_pct[:5]}")
          daily = json.load(open('data/daily.json'))
          con_bb = [d for d in daily if d.get('bb_high') is not None]
          print(f"bb_high: {len(con_bb)}/{len(daily)} días · último: "
                + str({k: con_bb[-1].get(k) for k in ('date','bb_high','bb_low','bb_last')} if con_bb else None))
          hist = json.load(open('data/status_history.json'))
          print(f"status_history: {len(hist)} puntos · {hist[-1] if hist else None}")
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: data-fase3
          path: data/
          retention-days: 3
