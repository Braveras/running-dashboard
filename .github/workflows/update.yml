name: Update dashboard

on:
  schedule:
    - cron: "0 8 * * *"   # 10:00 Madrid (verano)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Madrid
      HAS_PAT: ${{ secrets.ACTIONS_PAT != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "garminconnect==0.3.5" tzdata
      # ANTES de tocar Garmin: cada fetch consume el refresh token y el nuevo
      # solo sobrevive si podemos re-guardarlo en el secret. Con el PAT muerto,
      # seguir adelante quema tokens (Garmin revoca la familia al 3er reuso —
      # averías de jul y ago 2026). Mejor abortar aquí: la web sigue sirviendo
      # los últimos datos y el token queda intacto hasta renovar el PAT.
      - name: Check ACTIONS_PAT can write secrets
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Falta el secret ACTIONS_PAT."; exit 1
          fi
          if ! gh api "repos/$GITHUB_REPOSITORY/actions/secrets/public-key" --silent; then
            echo "::error::ACTIONS_PAT inválido o caducado (401). Renueva el PAT y actualiza el secret ACTIONS_PAT. El token Garmin NO se ha consumido."
            exit 1
          fi
          echo "PAT OK."
      - name: Fetch Garmin data
        env:
          GARMIN_TOKENS_B64: ${{ secrets.GARMIN_TOKENS_B64 }}
          GARMIN_DISPLAY_NAME: ${{ secrets.GARMIN_DISPLAY_NAME }}
          TOKEN_OUT: .garmin_tokens_new
        run: |
          echo "$GARMIN_TOKENS_B64" | base64 -d > .garmin_tokens
          python scripts/fetch_data.py
          rm .garmin_tokens
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: daily update $(date -u +%F)"
          git push
      - name: Build site
        run: |
          mkdir -p site
          cp -r web/* site/
          cp -r data site/data
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
      # Al final para no bloquear commit ni deploy. El PAT ya se validó arriba;
      # aquí solo quedan fallos transitorios -> 3 intentos antes de rendirse.
      - name: Rotate token secret
        if: always() && env.HAS_PAT == 'true'
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_PAT }}
        run: |
          if [ ! -f .garmin_tokens_new ]; then
            echo "Sin token nuevo que rotar (fetch no lo volcó)."; exit 0
          fi
          for i in 1 2 3; do
            if base64 -w0 .garmin_tokens_new | gh secret set GARMIN_TOKENS_B64 --repo "$GITHUB_REPOSITORY"; then
              echo "Secret GARMIN_TOKENS_B64 rotado."; rm .garmin_tokens_new; exit 0
            fi
            echo "Intento $i/3 falló, reintentando en 20s..."; sleep 20
          done
          echo "::error::No se pudo rotar GARMIN_TOKENS_B64 tras 3 intentos. El token Garmin del secret está desfasado: si el próximo run falla con invalid_grant, regenerar con scripts/login.py."
          exit 1
