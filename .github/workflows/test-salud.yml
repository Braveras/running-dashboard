name: Sonda salud (probe)
# Temporal (rama sonda-salud): inventaria endpoints de salud de Garmin.
# Sin commit ni deploy. SIEMPRE con validación de PAT antes y rotación después.

on:
  workflow_dispatch:
  push:
    branches: [sonda-salud]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Madrid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "garminconnect==0.3.5" tzdata
      - name: Check ACTIONS_PAT can write secrets
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_PAT }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/secrets/public-key" --silent || {
            echo "::error::ACTIONS_PAT inválido: abortando sin consumir token Garmin."; exit 1; }
      - name: Fetch completo (prueba pipeline salud, sin commit ni deploy)
        env:
          GARMIN_TOKENS_B64: ${{ secrets.GARMIN_TOKENS_B64 }}
          GARMIN_DISPLAY_NAME: ${{ secrets.GARMIN_DISPLAY_NAME }}
          TOKEN_OUT: .garmin_tokens_new
        run: |
          echo "$GARMIN_TOKENS_B64" | base64 -d > .garmin_tokens
          python scripts/fetch_data.py
          rm .garmin_tokens
      - name: Resumen ficheros nuevos
        run: |
          python - <<'EOF'
          import json
          h = json.load(open('data/health.json'))
          con = [d for d in h if d.get('rhr') is not None]
          print(f"health.json: {len(h)} días, {len(con)} con rhr · último: { {k: h[-1].get(k) for k in ('date','rhr','readiness_score','stress_avg','spo2_sleep','steps')} }")
          t = json.load(open('data/trends.json'))
          print(f"trends.json: {len(t)} filas · {t[-1] if t else None}")
          p = json.load(open('data/prs.json'))
          print(f"prs.json: {len(p)} PRs")
          sh = json.load(open('data/status_history.json'))
          nulls = [x for x in sh if x.get('acute_load') is None and x.get('chronic_load') is None and x.get('vo2max') is None]
          print(f"status_history: {len(sh)} filas, {len(nulls)} todo-null")
          d = json.load(open('data/daily.json'))
          print(f"daily.json: {len(d)} días · claves última fila: {sorted(d[-1].keys())}")
          EOF
      - name: Rotate token secret
        if: always()
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_PAT }}
        run: |
          if [ ! -f .garmin_tokens_new ]; then echo "Sin token que rotar."; exit 0; fi
          for i in 1 2 3; do
            if base64 -w0 .garmin_tokens_new | gh secret set GARMIN_TOKENS_B64 --repo "$GITHUB_REPOSITORY"; then
              echo "Rotado."; rm .garmin_tokens_new; exit 0
            fi
            sleep 20
          done
          echo "::error::Rotación fallida tras 3 intentos."; exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: data-salud
          path: data/
          retention-days: 3
